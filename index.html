<!DOCTYPE html>
<html lang="zh-Hant" data-theme="sepia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e6c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="山河武俠">
  <meta name="description" content="書架：《山河武俠》（Yuki 著），以及緹亞即將連載的蒸汽朋克新書。">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>書架</title>
  <script>
    try {
      var t = localStorage.getItem("shanhe.theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body class="page-shelf">
  <header class="hero">
    <div class="seal">書架</div>
    <h1>書架</h1>
    <p class="author">選擇要讀的書</p>
  </header>

  <div class="shelf">
    <article class="book" data-book="shanhe" data-count="240">
      <a class="book-main" href="./toc.html">
        <span class="book-cover" aria-hidden="true">山河</span>
        <span class="book-info">
          <span class="book-title">山河武俠</span>
          <span class="book-author">Yuki　武俠喜劇連載</span>
          <span class="book-meta">目前刊載 240 章</span>
        </span>
      </a>
      <div id="shanhe-continue" class="book-progress" hidden>
        <span class="kicker">目前看到</span>
        <span id="continue-title" class="card-title"></span>
        <div class="overall">
          <div id="overall-meta" class="overall-meta"></div>
          <div id="overall-track" class="overall-track" role="progressbar" aria-label="全書閱讀進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="overall-fill" class="overall-fill"></div>
          </div>
        </div>
        <a id="continue-btn" class="continue-btn" href="./chapter.html">繼續閱讀</a>
      </div>
    </article>

    <article class="book is-soon" data-book="steampunk" aria-disabled="true">
      <div class="book-main">
        <span class="book-cover" aria-hidden="true">新書</span>
        <span class="book-info">
          <span class="book-title">緹亞・蒸汽朋克新書</span>
          <span class="book-author">緹亞　蒸汽朋克・維多利亞風</span>
          <span class="book-badge">即將連載</span>
        </span>
      </div>
    </article>
  </div>

  <p id="homescreen-hint" class="hint">用手機瀏覽器打開後，可加入主畫面，下次就能像 App 一樣點開讀。</p>

  <footer class="site-footer">山河武俠　·　Yuki</footer>
  <script src="./js/app.js"></script>
</body>
</html>
